apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  labels:
    app: admin-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: admin-api
        image: sunnytyagi13/call-booking-admin-api:16
        ports:
        - containerPort: 1004
        env:
            - name: PORT
              value: "1004"
