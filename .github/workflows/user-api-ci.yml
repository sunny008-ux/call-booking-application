name: User API CI

on:
  push:
    paths:
      - "user-api/**"
  pull_request:
    paths:
      - "user-api/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: user-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: admin-api/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          projectBaseDir: user-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      - name: Run tests (optional)
        run: npm test --if-present

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build \
            -t sunnytyagi13/user-api:latest \
            -t sunnytyagi13/user-api:$SHORT_SHA \
            .

      - name: Push Docker Image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker push sunnytyagi13/user-api:latest
          docker push sunnytyagi13/user-api:$SHORT_SHA
