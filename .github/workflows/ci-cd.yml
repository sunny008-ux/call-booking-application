name: Microservices CI Pipeline

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-api
          - user-api
          - admin-ui
          - user-ui

    env:
      IMAGE_REPO: sunnytyagi13/call-booking

    steps:
    # -------------------------
    # 1. Checkout Code
    # -------------------------
    - name: Checkout Code
      uses: actions/checkout@v4

    # -------------------------
    # 2. Setup Node.js
    # -------------------------
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ${{ matrix.service }}/package-lock.json

    # -------------------------
    # 3. Install Dependencies
    # -------------------------
    - name: Install Dependencies
      run: npm install
      working-directory: ${{ matrix.service }}

    # -------------------------
    # 4. Run Tests
    # -------------------------
    - name: Run Tests
      run: npm test || true
      working-directory: ${{ matrix.service }}

    # -------------------------
    # 5. SonarQube Scan (FIXED)
    # -------------------------
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v2
      with:
        projectBaseDir: ${{ matrix.service }}
        args: >
          -Dsonar.projectKey=call-booking-${{ matrix.service }}
          -Dsonar.projectName=call-booking-${{ matrix.service }}
          -Dsonar.sources=.
          -Dsonar.exclusions=node_modules/**,dist/**,build/**
      env:
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # -------------------------
    # 6. Docker Login
    # -------------------------
    - name: Docker Login
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # -------------------------
    # 7. Build Docker Image
    # -------------------------
    - name: Build Docker Image
      run: |
        docker build \
          -t $IMAGE_REPO-${{ matrix.service }}:${{ github.run_number }} .
      working-directory: ${{ matrix.service }}

    # -------------------------
    # 8. Trivy Image Scan
    # -------------------------
    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_REPO }}-${{ matrix.service }}:${{ github.run_number }}
        severity: HIGH,CRITICAL
        exit-code: 0

    # -------------------------
    # 9. Push Docker Image
    # -------------------------
    - name: Push Docker Image
      run: |
        docker push $IMAGE_REPO-${{ matrix.service }}:${{ github.run_number }}

      
