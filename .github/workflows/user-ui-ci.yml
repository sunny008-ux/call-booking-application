name: User UI CI

on:
  push:
    paths:
      - "user-ui/**"

jobs:
  build-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: user-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: user-ui/package-lock.json

      - name: Install dependencies
        run: npm install

      # Recommended: fix code instead of CI=false
      - name: Build UI
        run: npm run build
        # TEMP workaround if needed:
        # run: CI=false npm run build

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build \
            -t sunnytyagi13/user-ui:latest \
            -t sunnytyagi13/user-ui:$SHORT_SHA \
            .

      - name: Push Docker Image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker push sunnytyagi13/user-ui:latest
          docker push sunnytyagi13/user-ui:$SHORT_SHA
