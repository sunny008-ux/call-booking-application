name: User UI CI

on:
  push:
    paths:
      - "user-ui/**"

jobs:
  build-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: user-ui

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      # 3️⃣ Install & build UI
      - name: Install dependencies
        run: npm install

      - name: Build UI
        run: npm run build

      # 4️⃣ Docker login (using token)
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build Docker image with multiple tags
      - name: Build Docker Image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker build \
            -t sunnytyagi13/user-ui:latest \
            -t sunnytyagi13/user-ui:$SHORT_SHA \
            .

      # 6️⃣ Push Docker images
      - name: Push Docker Image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          docker push sunnytyagi13/user-ui:latest
          docker push sunnytyagi13/user-ui:$SHORT_SHA
